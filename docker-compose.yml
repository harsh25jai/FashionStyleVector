version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant
    container_name: fashion_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: fashion_api
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    env_file:
      - .env

volumes:
  qdrant_data: